[project]
name = "agent-factory"
version = "0.1.0"
description = "Local multi-worker agent factory runtime"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
build = [
  "pyinstaller>=6.0,<7",
]

[project.scripts]
agent-factory = "agent_factory.cli:main"
chartpatch = "chartpatch.cli:main"

[tool.setuptools.packages.find]
include = ["agent_factory*", "chartpatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not e2e"]
markers = [
  "e2e: opt-in end-to-end tests gated by CHARTPATCH_RUN_E2E=1",
]
