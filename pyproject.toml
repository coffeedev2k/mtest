[project]
name = "agent-factory"
version = "0.1.0"
description = "Local multi-worker agent factory runtime"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
agent-factory = "agent_factory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
