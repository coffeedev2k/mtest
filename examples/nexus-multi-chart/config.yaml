registry:
  url: localhost:5000
  username: admin
  password: chartpatch-nexus-password

charts:
  - name: rabbitmq
    source:
      repo: oci://registry-1.docker.io/bitnamicharts
      chart: rabbitmq
      version: 16.0.13
    image_overrides:
      docker.io/bitnami/rabbitmq:4.1.3-debian-12-r1: docker.io/bitnamilegacy/rabbitmq:4.1.3-debian-12-r1
    patch:
      file: examples/nexus-multi-chart/patches/add-nexus-example-marker.patch
    output:
      chart_ref: oci://localhost:5000/helm/rabbitmq
    verification:
      helm_lint: true
      helm_template: true
  - name: raw
    source:
      repo: https://charts.helm.sh/incubator
      chart: raw
      version: 0.2.5
    patch:
      file: examples/nexus-multi-chart/patches/add-nexus-example-marker.patch
    output:
      chart_ref: oci://localhost:5000/helm/raw
    verification:
      helm_lint: true
      helm_template: true
  - name: envoy-gateway
    source:
      repo: oci://docker.io/envoyproxy
      chart: gateway-helm
      version: v1.8.0
    patch:
      file: examples/nexus-multi-chart/patches/add-nexus-example-marker.patch
    output:
      chart_ref: oci://localhost:5000/helm/envoy-gateway
    verification:
      helm_lint: true
      helm_template: true
  - name: kubed
    source:
      repo: https://charts.appscode.com/stable/
      chart: kubed
      version: v0.13.2
    image_overrides:
      appscode/kubed:v0.13.2: docker.io/rancher/mirrored-appscode-kubed:v0.13.2
    patch:
      file: examples/nexus-multi-chart/patches/add-nexus-example-marker.patch
    output:
      chart_ref: oci://localhost:5000/helm/kubed
    verification:
      helm_lint: true
      helm_template: true
  - name: karpenter
    source:
      repo: oci://public.ecr.aws/karpenter
      chart: karpenter
      version: 1.11.1
    values:
      settings.clusterName: chartpatch-example
    patch:
      file: examples/nexus-multi-chart/patches/add-nexus-example-marker.patch
    output:
      chart_ref: oci://localhost:5000/helm/karpenter
    verification:
      helm_lint: true
      helm_template: true
  - name: aws-load-balancer-controller
    source:
      repo: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      version: 3.4.0
    values:
      clusterName: chartpatch-example
    patch:
      file: examples/nexus-multi-chart/patches/add-nexus-example-marker.patch
    output:
      chart_ref: oci://localhost:5000/helm/aws-load-balancer-controller
    verification:
      helm_lint: true
      helm_template: true
  - name: kyverno
    source:
      repo: https://kyverno.github.io/kyverno
      chart: kyverno
      version: 3.8.0
    patch:
      file: examples/nexus-multi-chart/patches/add-nexus-example-marker.patch
    output:
      chart_ref: oci://localhost:5000/helm/kyverno
    verification:
      helm_lint: true
      helm_template: true
  - name: kube-bench
    source:
      repo: https://charts.deliveryhero.io/
      chart: kube-bench
      version: 0.1.16
    patch:
      file: examples/nexus-multi-chart/patches/add-nexus-example-marker.patch
    output:
      chart_ref: oci://localhost:5000/helm/kube-bench
    verification:
      helm_lint: true
      helm_template: true
  - name: policy-reporter
    source:
      repo: https://kyverno.github.io/policy-reporter
      chart: policy-reporter
      version: 3.7.4
    patch:
      file: examples/nexus-multi-chart/patches/add-nexus-example-marker.patch
    output:
      chart_ref: oci://localhost:5000/helm/policy-reporter
    verification:
      helm_lint: true
      helm_template: true
